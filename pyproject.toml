[project]
name = "turbine"
version = "0.1.0"
description = "Inference serving benchmarks on free-tier GPUs: TTFT, throughput, tokens per second per dollar, and the traffic level where self-hosting stops making sense."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer>=0.15",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
